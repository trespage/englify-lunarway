<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Squircle rounded background matching tab design in Image 3 -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#tabBg)" stroke="#7DD3FC" stroke-width="1"/>

  <!-- Englify Mascot Cat Head -->
  <g transform="translate(0, 0.5)">
    <!-- Ears -->
    <polygon points="5,15 10,4 16,10" fill="#001B48"/>
    <polygon points="27,15 22,4 16,10" fill="#001B48"/>
    <polygon points="7,13.5 10,6.5 14,10.5" fill="url(#earInner)"/>
    <polygon points="25,13.5 22,6.5 18,10.5" fill="url(#earInner)"/>

    <!-- Head Base -->
    <circle cx="16" cy="19" r="11" fill="#001B48"/>

    <!-- Cheeks & Muzzle (White) -->
    <path d="M8.5 20 C8.5 14, 23.5 14, 23.5 20 C23.5 25.5, 8.5 25.5, 8.5 20 Z" fill="#FFFFFF"/>

    <!-- Eyes -->
    <ellipse cx="12.5" cy="18.5" rx="1.6" ry="2" fill="#001B48"/>
    <ellipse cx="19.5" cy="18.5" rx="1.6" ry="2" fill="#001B48"/>

    <!-- Eye Highlights -->
    <circle cx="12" cy="17.8" r="0.6" fill="#FFFFFF"/>
    <circle cx="19" cy="17.8" r="0.6" fill="#FFFFFF"/>

    <!-- Pink Nose -->
    <polygon points="15.2,21.2 16.8,21.2 16,22" fill="#F472B6"/>

    <!-- Cute Smiling Mouth -->
    <path d="M16 22 L16 23.2 M14.8 23.2 C15.4 23.7, 16 23.2, 16 23.2 C16 23.2, 16.6 23.7, 17.2 23.2" stroke="#001B48" stroke-width="0.75" fill="none" stroke-linecap="round"/>
  </g>
</svg>